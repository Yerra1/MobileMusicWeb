<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title>Library — Mobile Music</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="library">
  <main class="app">
    <section class="page page-library active">
      <div class="library-header">
        <div>
          <div class="page-title">LIBRARY</div>
          <h1>Your Library</h1>
        </div>
        <button class="round-btn library-add" aria-label="Add"><span>+</span></button>
      </div>

      <div class="library-filters" role="tablist" aria-label="Library sections">
        <button class="library-filter active" data-filter="playlists">Playlists</button>
        <button class="library-filter" data-filter="albums">Albums</button>
        <button class="library-filter" data-filter="artists">Artists</button>
        <button class="library-filter" data-filter="songs">Songs</button>
      </div>

      <div class="library-feature glass-card">
        <div class="library-feature-art c4"></div>
        <div class="library-feature-copy">
          <span>Recently added</span>
          <strong>My Music Mix</strong>
          <small>16 songs · Updated today</small>
        </div>
        <button class="library-play" id="libraryPlay" aria-label="Play library">
          <svg viewBox="0 0 24 24"><path d="m9 6 9 6-9 6z"/></svg>
        </button>
      </div>

      <div class="section-heading library-section-title">
        <h2 id="libraryTitle">Playlists</h2>
      </div>
      <div class="library-grid" id="libraryGrid"></div>
    </section>
  </main>

  <nav class="mobile-bottom fixed-bottom" aria-label="Main navigation">
    <a href="index.html" data-page-link="home" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="library.html" data-page-link="library" aria-label="Library">
      <svg viewBox="0 0 24 24"><path d="M4 5.5h16v13H4z"/><path d="M8 5.5v13M12 5.5v13"/></svg>
      <span>Library</span>
    </a>
    <a href="player.html" data-page-link="playing" aria-label="Now Playing">
      <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="3.5"/><circle cx="16.5" cy="16" r="3.5"/></svg>
      <span>Playing</span>
    </a>
    <a href="search.html" data-page-link="search" aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 5 5"/></svg>
      <span>Search</span>
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
