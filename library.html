<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#08090d"><title>Library — Mobile Music</title><link rel="stylesheet" href="style.css">
<style>
.library-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}.library-header h1{font-size:34px;margin-top:2px}.library-add span{font-size:25px;font-weight:300;line-height:1}.library-filters{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:18px}.library-filters::-webkit-scrollbar{display:none}.library-filter{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:7px 14px;background:rgba(255,255,255,.055);color:#aaa8b0;white-space:nowrap;font-size:13px;transition:.2s}.library-filter.active{background:rgba(255,255,255,.17);color:#fff;border-color:rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}.library-feature{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid rgba(255,255,255,.13);border-radius:19px;background:linear-gradient(135deg,rgba(255,255,255,.105),rgba(255,255,255,.035));box-shadow:0 16px 38px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);margin-bottom:22px}.library-feature-art{width:66px;height:66px;flex:0 0 66px;border-radius:13px;box-shadow:0 8px 18px rgba(0,0,0,.28)}.library-feature-copy{min-width:0;display:flex;flex-direction:column;gap:2px}.library-feature-copy span{font-size:11px;color:#a7a4ad}.library-feature-copy strong{font-size:16px}.library-feature-copy small{font-size:11px;color:#85838b}.library-play{margin-left:auto;width:40px;height:40px;border:0;border-radius:50%;display:grid;place-items:center;background:#f2f2f5;color:#151519;box-shadow:0 5px 16px rgba(0,0,0,.25)}.library-play svg{width:19px;height:19px;fill:currentColor}.library-section-title{margin-top:0}.library-grid{display:grid;gap:3px}.library-item{min-height:70px;width:100%;display:flex;align-items:center;gap:12px;padding:8px 5px;border:0;border-bottom:1px solid rgba(255,255,255,.10);background:transparent;color:#fff;text-align:left;border-radius:12px;transition:.18s}.library-item:active{transform:scale(.985);background:rgba(255,255,255,.065)}.library-art,.artist-avatar{width:54px;height:54px;flex:0 0 54px;border-radius:12px;box-shadow:0 7px 16px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.1)}.artist-avatar{display:grid;place-items:center;border-radius:50%;font-size:18px;font-weight:600;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.4)}.library-item-copy{min-width:0;display:flex;flex-direction:column;gap:3px}.library-item-copy strong{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.library-item-copy small{font-size:12px;color:#94919a}.library-chevron{margin-left:auto;color:#7f7d85;font-size:25px;padding:0 5px}.mobile-bottom a{grid-template-rows:22px 13px;gap:2px}.mobile-bottom a span{font-size:9px;line-height:11px;display:block}.mobile-bottom a svg{grid-row:1}.mobile-bottom a span{grid-row:2}
@media(max-width:430px){.library-header h1{font-size:32px}.library-feature-art{width:62px;height:62px;flex-basis:62px}}
</style>
</head>
<body data-page="library">
<main class="app"><section class="page page-library active">
<div class="library-header"><div><div class="page-title">LIBRARY</div><h1>Your Library</h1></div><button class="round-btn library-add" aria-label="Add"><span>+</span></button></div>
<div class="library-filters" role="tablist" aria-label="Library sections"><button class="library-filter active" data-filter="playlists">Playlists</button><button class="library-filter" data-filter="albums">Albums</button><button class="library-filter" data-filter="artists">Artists</button><button class="library-filter" data-filter="songs">Songs</button></div>
<div class="library-feature glass-card"><div class="library-feature-art c4"></div><div class="library-feature-copy"><span>Recently added</span><strong>My Music Mix</strong><small>16 songs · Updated today</small></div><button class="library-play" id="libraryPlay" aria-label="Play library"><svg viewBox="0 0 24 24"><path d="m9 6 9 6-9 6z"/></svg></button></div>
<div class="section-heading library-section-title"><h2 id="libraryTitle">Playlists</h2></div><div class="library-grid" id="libraryGrid"></div>
</section></main>
<nav class="mobile-bottom fixed-bottom" aria-label="Main navigation">
<a href="index.html" data-page-link="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
<a class="selected" href="library.html" data-page-link="library" aria-label="Library"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v13H4z"/><path d="M8 5.5v13M12 5.5v13"/></svg><span>Library</span></a>
<a href="player.html" data-page-link="playing" aria-label="Now Playing"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="3.5"/><circle cx="16.5" cy="16" r="3.5"/></svg><span>Playing</span></a>
<a href="search.html" data-page-link="search" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 5 5"/></svg><span>Search</span></a>
</nav><script src="app.js"></script></body></html>
